<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmie's Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef1ec;
    --paper: #fffdf8;
    --ink: #24322e;
    --ink-soft: #5b6862;
    --teal: #2f4f4d;
    --teal-light: #3f6663;
    --amber: #dd9c4f;
    --amber-soft: #f3e3cd;
    --coral: #c97160;
    --line: #d8ddd5;
    --radius: 14px;
    --shadow: 0 10px 30px -12px rgba(36,50,46,0.35);
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  /* Header */
  header{
    margin-bottom: 22px;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal-light);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub{
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap: 6px;
    margin: 20px 0 18px;
    border-bottom: 1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 10px 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
    font-family: inherit;
  }
  .tab.active{
    color: var(--teal);
    border-bottom-color: var(--amber);
  }

  /* Progress strip */
  .progress-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .progress-bar{
    flex:1;
    height: 4px;
    background: var(--line);
    border-radius: 4px;
    margin: 0 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--teal);
    transition: width .25s ease;
  }

  /* Flashcard */
  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card-scene{
    width: 100%;
    max-width: 420px;
    height: 270px;
    perspective: 1400px;
    margin: 4px 0 22px;
  }
  .card{
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card.flipped{
    transform: rotateY(180deg);
  }
  .face{
    position:absolute;
    inset:0;
    border-radius: var(--radius);
    backface-visibility: hidden;
    box-shadow: var(--shadow);
    padding: 28px;
    display:flex;
    flex-direction:column;
  }
  .face.front{
    background: var(--paper);
    border: 1px solid var(--line);
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .face.back{
    background: var(--teal);
    color: #f4f1e8;
    transform: rotateY(180deg);
    justify-content:flex-start;
  }
  .card-tag{
    position:absolute;
    top: 16px;
    left: 18px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform:uppercase;
    color: var(--amber);
    font-weight: 700;
  }
  .face.back .card-tag{ color: var(--amber); }
  .word-title{
    font-family:'Fraunces', serif;
    font-size: 30px;
    font-weight: 600;
    line-height:1.15;
    margin: 0 0 6px;
  }
  .hint{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 10px;
  }
  .back-meaning{
    font-family:'Fraunces', serif;
    font-size: 21px;
    font-weight: 600;
    margin: 30px 0 10px;
    line-height: 1.3;
  }
  .back-example{
    font-size: 14px;
    line-height: 1.55;
    color: #dfe6e2;
    font-style: italic;
    border-left: 2px solid var(--amber);
    padding-left: 12px;
  }

  /* Controls */
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    width: 100%;
    max-width: 420px;
  }
  .btn{
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    padding: 11px 18px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:hover{ box-shadow: 0 6px 16px -8px rgba(36,50,46,0.35); }
  .btn:active{ transform: scale(0.97); }
  .btn.icon{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    font-size: 18px;
    flex-shrink:0;
  }
  .btn.primary{
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
    flex:1;
    text-align:center;
  }
  .btn.amber{
    background: var(--amber-soft);
    border-color: var(--amber-soft);
    color: #8a5a23;
    flex:1;
    text-align:center;
  }
  .feedback-row{
    display:flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    margin-top: 14px;
  }

  .empty{
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .empty .word-title{ color: var(--ink); }

  /* Quiz */
  .direction-toggle{
    display:flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .dir-btn{
    flex:1;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
  }
  .dir-btn.active{
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
  }
  .quiz-card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin: 4px 0 18px;
    position: relative;
    text-align:center;
  }
  .quiz-card .card-tag{
    position: static;
    display:block;
    margin-bottom: 10px;
  }
  .quiz-input{
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fcfbf7;
    color: var(--ink);
    margin-top: 14px;
    text-align:center;
  }
  .quiz-input:focus{
    outline: 2px solid var(--teal-light);
    outline-offset: 1px;
  }
  .quiz-input.correct{ border-color: var(--teal); background: #e9f1ee; }
  .quiz-input.partial{ border-color: var(--amber); background: var(--amber-soft); }
  .quiz-input.incorrect{ border-color: var(--coral); background: #f6e9e6; }

  .mc-options{
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 16px;
    text-align: left;
  }
  .mc-option{
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fcfbf7;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: border-color .12s ease, background .12s ease;
  }
  .mc-option:hover:not(.correct):not(.incorrect):not(.disabled){
    border-color: var(--teal-light);
  }
  .mc-option.correct{
    border-color: var(--teal);
    background: #e9f1ee;
    font-weight: 700;
  }
  .mc-option.incorrect{
    border-color: var(--coral);
    background: #f6e9e6;
  }
  .mc-option.disabled{
    cursor: default;
    opacity: 0.6;
  }
  .quiz-feedback{
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.6;
    min-height: 24px;
  }
  .quiz-feedback .verdict{
    font-weight: 700;
    margin-right: 6px;
  }
  .quiz-feedback .verdict.correct{ color: var(--teal); }
  .quiz-feedback .verdict.partial{ color: #b9792e; }
  .quiz-feedback .verdict.incorrect{ color: var(--coral); }
  .quiz-feedback .answer-key{
    display:block;
    margin-top: 4px;
    color: var(--ink-soft);
  }
  .quiz-feedback .answer-key b{ color: var(--ink); }
  .quiz-example{
    display:block;
    margin-top: 8px;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 13px;
  }

  /* List view */
  .list-card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .list-head{
    display:flex;
    justify-content: space-between;
    align-items:flex-start;
    gap: 10px;
  }
  .list-word{
    font-family:'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  .list-meaning{
    font-size: 14px;
    color: var(--teal);
    font-weight: 600;
    margin: 4px 0 6px;
  }
  .list-example{
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    line-height:1.5;
    margin: 0;
  }
  .pill{
    font-size: 11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .pill.new{ background: var(--amber-soft); color:#8a5a23; }
  .pill.known{ background:#e3ece4; color: var(--teal); }
  .pill.topic{ background: #e8eef4; color: #2a4a6b; font-size: 10px; }

  /* Topic filter bar */
  .topic-filter{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .topic-chip{
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .topic-chip.active{
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
  }
  .delete-btn{
    background:none;
    border:none;
    color: var(--coral);
    font-size: 12px;
    font-weight: 600;
    cursor:pointer;
    padding: 4px 0 0;
    font-family: inherit;
  }

  /* Add form */
  .add-form{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
  }
  .add-form h3{
    font-family:'Fraunces', serif;
    font-size: 17px;
    margin: 0 0 12px;
  }
  .field{
    margin-bottom: 10px;
  }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field textarea{
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fcfbf7;
    color: var(--ink);
    resize: vertical;
  }
  .field textarea{ min-height: 56px; }
  .field input:focus, .field textarea:focus{
    outline: 2px solid var(--teal-light);
    outline-offset: 1px;
  }

  .section-label{
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    margin: 22px 0 10px;
  }

  .toast{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--teal);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index: 10;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    .card, .toast{ transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Anmie's Vocab</div>
    <h1>Anmie's Little Book</h1>
    <p class="sub">Lật thẻ để xem nghĩa &amp; câu ví dụ — tự thêm từ mới khi bạn học được.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="review">Ôn tập</button>
    <button class="tab" data-tab="quiz">Quiz</button>
    <button class="tab" data-tab="list">Danh sách &amp; Thêm từ</button>
  </div>

  <!-- REVIEW VIEW -->
  <div id="reviewView" class="stage">
    <div class="topic-filter" id="reviewTopicFilter" style="justify-content:center;"></div>
    <div class="progress-row">
      <span id="progressLabel">0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span id="knownLabel">0 đã nhớ</span>
    </div>

    <div id="cardScene" class="card-scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-tag">Từ vựng</div>
          <h2 class="word-title" id="frontWord">—</h2>
          <p class="hint">Chạm để xem nghĩa</p>
          <p id="frontTopic" style="font-size:11px; color:var(--ink-soft); margin-top:8px; letter-spacing:0.06em;"></p>
        </div>
        <div class="face back">
          <div class="card-tag">Nghĩa</div>
          <div class="back-meaning" id="backMeaning">—</div>
          <div class="back-example" id="backExample">—</div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn icon" id="prevBtn" title="Từ trước" aria-label="Từ trước">‹</button>
      <button class="btn primary" id="shuffleBtn">Xáo trộn</button>
      <button class="btn icon" id="nextBtn" title="Từ sau" aria-label="Từ sau">›</button>
    </div>
    <div class="feedback-row">
      <button class="btn amber" id="reviewAgainBtn">Cần ôn lại</button>
      <button class="btn primary" id="knownBtn">Đã nhớ ✓</button>
    </div>
  </div>

  <!-- QUIZ VIEW -->
  <div id="quizView" style="display:none;">
    <div class="topic-filter" id="quizTopicFilter"></div>
    <div class="direction-toggle">
      <button class="dir-btn active" data-dir="en-vi">Anh → Việt</button>
      <button class="dir-btn" data-dir="vi-en">Việt → Anh</button>
    </div>
    <div class="direction-toggle">
      <button class="dir-btn active" data-mode="type">Gõ đáp án</button>
      <button class="dir-btn" data-mode="mc">Trắc nghiệm</button>
    </div>
    <div class="progress-row">
      <span id="quizProgressLabel">Câu 0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="quizProgressFill" style="width:0%"></div></div>
      <span id="quizScoreLabel">0 đúng</span>
    </div>

    <div class="quiz-card">
      <div class="card-tag" id="quizDirLabel">Dịch nghĩa sang tiếng Việt</div>
      <p id="quizTopicLabel" style="font-size:11px; color:var(--ink-soft); margin: 2px 0 0; letter-spacing:0.06em;"></p>
      <h2 class="word-title" id="quizWord">—</h2>
      <input type="text" id="quizInput" class="quiz-input" placeholder="Gõ nghĩa tiếng Việt..." autocomplete="off">
      <div id="mcOptions" class="mc-options" style="display:none;"></div>
      <div id="quizFeedback" class="quiz-feedback"></div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;" id="quizNavRow">
      <button class="btn primary" id="quizCheckBtn" style="width:100%; max-width:420px;">Kiểm tra</button>
      <button class="btn" id="quizNextBtn" style="width:100%; max-width:420px; text-align:center;" title="Câu tiếp" aria-label="Câu tiếp">Next →</button>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView" style="display:none;">
    <div class="add-form">
      <h3>Thêm từ mới</h3>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="btn" id="importBtn" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px;">
          <span>📥</span> Import Excel / CSV
        </button>
        <input type="file" id="importFile" accept=".xlsx,.csv" style="display:none;">
        <button class="btn" id="exportBtn" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px;">
          <span>📤</span> Export CSV
        </button>
      </div>
      <div class="field">
        <label for="inWord">Từ / cụm từ (tiếng Anh)</label>
        <input type="text" id="inWord" placeholder="VD: to cut back on">
      </div>
      <div class="field">
        <label for="inMeaning">Nghĩa (tiếng Việt)</label>
        <input type="text" id="inMeaning" placeholder="VD: cắt giảm (chi tiêu)">
      </div>
      <div class="field">
        <label for="inExample">Câu ví dụ</label>
        <textarea id="inExample" placeholder="VD: We had to cut back on eating out this month."></textarea>
      </div>
      <div class="field">
        <label for="inTopic">Chủ đề / Bài học</label>
        <input type="text" id="inTopic" placeholder="VD: Living with Debt · BBC 6 Min">
      </div>
      <button class="btn primary" id="addBtn" style="width:100%;">Thêm vào sổ</button>
    </div>

    <div class="section-label">Tất cả từ (<span id="totalCount">0</span>)</div>
    <div class="topic-filter" id="topicFilter"></div>
    <div id="listContainer"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const STORAGE_KEY = 'vocab-cards-v1';

const DEFAULT_WORDS = [
  { word: "debt", meaning: "nợ", example: "She took out a loan and now has a lot of debt to pay off.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "pay back / pay off / clear (debt)", meaning: "trả nợ, hoàn lại tiền đã vay", example: "It took him three years to pay off his student loan.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "make ends meet", meaning: "đủ tiền chi tiêu cơ bản (ăn, ở, hóa đơn)", example: "With rent rising every year, it's getting harder to make ends meet.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "in arrears", meaning: "nợ quá hạn, chưa trả đúng hạn", example: "After losing his job, he fell behind and was in arrears on his rent.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "the never-never", meaning: "mua trả góp dần (kiểu trả mãi không hết)", example: "He bought the sofa on the never-never and is still paying for it.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "financial strain", meaning: "căng thẳng / áp lực tài chính", example: "The medical bills put a lot of financial strain on the family.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to save money", meaning: "tiết kiệm tiền", example: "I'm trying to save money for a trip next year.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to spend money (on something)", meaning: "chi tiền vào việc gì đó", example: "She spent most of her salary on rent and bills.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to count every penny", meaning: "tính toán chi li từng đồng", example: "After he lost his job, they had to count every penny.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to take out a loan", meaning: "vay tiền (ngân hàng, tổ chức tín dụng)", example: "They took out a loan to buy their first car.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to see a way out", meaning: "tìm được lối thoát / giải pháp", example: "He couldn't see a way out of his money problems.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to get out of control", meaning: "mất kiểm soát", example: "His spending got out of control after he got a credit card.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "low-income", meaning: "thu nhập thấp", example: "The charity helps low-income families with budgeting.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "an ordinary part of daily life", meaning: "một phần bình thường của cuộc sống hàng ngày", example: "For many people, worrying about bills is an ordinary part of daily life.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to fluctuate between A and B", meaning: "dao động qua lại giữa A và B", example: "Her mood fluctuated between hope and frustration.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "moral obligation", meaning: "nghĩa vụ đạo đức", example: "He felt a moral obligation to repay what he owed.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to miss a payment / bill", meaning: "lỡ/không thanh toán đúng hạn", example: "If you miss a payment, you may have to pay a late fee.", known: false, topic: "Living with Debt · BBC 6 Min" },
  { word: "to be disconnected", meaning: "bị cắt dịch vụ (điện, internet...)", example: "Their phone line was disconnected after they missed two bills.", known: false, topic: "Living with Debt · BBC 6 Min" }
];

let words = [];
let order = [];
let currentIndex = 0;

let activeTopicReview = null;
let activeTopicList = null;
let activeTopicQuiz = null;

let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = 0;
let quizChecked = false;
let quizDirection = 'en-vi';
let quizMode = 'type';

function getTopics(){
  const set = new Set();
  words.forEach(w => { if(w.topic) set.add(w.topic); });
  return [...set].sort();
}

function filteredWordsForReview(){
  if(!activeTopicReview) return words;
  return words.filter(w => w.topic === activeTopicReview);
}

function filteredWordsForQuiz(){
  if(!activeTopicQuiz) return words;
  return words.filter(w => w.topic === activeTopicQuiz);
}

const cardEl = document.getElementById('card');
const frontWordEl = document.getElementById('frontWord');
const backMeaningEl = document.getElementById('backMeaning');
const backExampleEl = document.getElementById('backExample');
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const knownLabel = document.getElementById('knownLabel');
const reviewView = document.getElementById('reviewView');
const quizView = document.getElementById('quizView');
const listView = document.getElementById('listView');
const listContainer = document.getElementById('listContainer');
const totalCount = document.getElementById('totalCount');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 1600);
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      words = JSON.parse(raw);
    } else {
      words = DEFAULT_WORDS.slice();
      await saveData();
    }
  } catch(e){
    words = DEFAULT_WORDS.slice();
  }
  resetOrder();
  render();
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  } catch(e){
    console.error('Storage error', e);
  }
}

function resetOrder(){
  const src = filteredWordsForReview();
  order = src.map((_, i) => words.indexOf(src[i]));
  currentIndex = 0;
}

function resetQuiz(){
  const src = filteredWordsForQuiz();
  quizOrder = src.map((_, i) => words.indexOf(src[i]));
  for(let i = quizOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [quizOrder[i], quizOrder[j]] = [quizOrder[j], quizOrder[i]];
  }
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = 0;
  quizChecked = false;
  renderQuiz();
}

function renderTopicFilters(){
  const topics = getTopics();

  // Review filter
  const rf = document.getElementById('reviewTopicFilter');
  rf.innerHTML = '';
  if(topics.length > 1){
    const allBtn = document.createElement('button');
    allBtn.className = 'topic-chip' + (!activeTopicReview ? ' active' : '');
    allBtn.textContent = 'Tất cả';
    allBtn.addEventListener('click', () => { activeTopicReview = null; resetOrder(); renderCard(); renderTopicFilters(); resetQuiz(); });
    rf.appendChild(allBtn);
    topics.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'topic-chip' + (activeTopicReview === t ? ' active' : '');
      btn.textContent = t;
      btn.addEventListener('click', () => { activeTopicReview = t; resetOrder(); renderCard(); renderTopicFilters(); resetQuiz(); });
      rf.appendChild(btn);
    });
  }

  // Quiz filter
  const qf = document.getElementById('quizTopicFilter');
  qf.innerHTML = '';
  if(topics.length > 1){
    const allBtn = document.createElement('button');
    allBtn.className = 'topic-chip' + (!activeTopicQuiz ? ' active' : '');
    allBtn.textContent = 'Tất cả';
    allBtn.addEventListener('click', () => { activeTopicQuiz = null; resetQuiz(); renderTopicFilters(); });
    qf.appendChild(allBtn);
    topics.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'topic-chip' + (activeTopicQuiz === t ? ' active' : '');
      btn.textContent = t;
      btn.addEventListener('click', () => { activeTopicQuiz = t; resetQuiz(); renderTopicFilters(); });
      qf.appendChild(btn);
    });
  }

  // List filter
  const lf = document.getElementById('topicFilter');
  lf.innerHTML = '';
  if(topics.length > 1){
    const allBtn = document.createElement('button');
    allBtn.className = 'topic-chip' + (!activeTopicList ? ' active' : '');
    allBtn.textContent = 'Tất cả';
    allBtn.addEventListener('click', () => { activeTopicList = null; renderList(); renderTopicFilters(); });
    lf.appendChild(allBtn);
    topics.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'topic-chip' + (activeTopicList === t ? ' active' : '');
      btn.textContent = t;
      btn.addEventListener('click', () => { activeTopicList = t; renderList(); renderTopicFilters(); });
      lf.appendChild(btn);
    });
  }
}

function normalizeVi(str){
  return str
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove diacritics
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function scoreSimilarity(userText, correctText){
  const u = normalizeVi(userText);
  const c = normalizeVi(correctText);
  if(!u) return 0;
  if(u === c) return 1;
  // word overlap ratio
  const uWords = new Set(u.split(' ').filter(w => w.length > 1));
  const cWords = c.split(' ').filter(w => w.length > 1);
  if(cWords.length === 0) return 0;
  let matches = 0;
  cWords.forEach(w => { if(uWords.has(w)) matches++; });
  const ratio = matches / cWords.length;
  // also check substring containment either way
  if(c.includes(u) || u.includes(c)) return Math.max(ratio, 0.85);
  return ratio;
}

function bestSimilarity(userText, correctText){
  const alternatives = correctText.split('/').map(s => s.trim()).filter(Boolean);
  let best = 0;
  alternatives.forEach(alt => {
    best = Math.max(best, scoreSimilarity(userText, alt));
  });
  return best;
}

function canonicalAnswer(item, direction){
  if(direction === 'en-vi') return item.meaning.trim();
  return item.word.split('/')[0].trim();
}

function generateOptions(item){
  const correct = canonicalAnswer(item, quizDirection);
  const correctNorm = normalizeVi(correct);

  const pool = [];
  const seen = new Set([correctNorm]);
  const src = filteredWordsForQuiz();
  src.forEach(w => {
    if(w === item) return;
    const candidate = canonicalAnswer(w, quizDirection);
    const norm = normalizeVi(candidate);
    if(!seen.has(norm)){
      seen.add(norm);
      pool.push(candidate);
    }
  });

  // shuffle pool
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  const distractors = pool.slice(0, 3);
  const options = [correct, ...distractors];

  // shuffle options
  for(let i = options.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  return { options, correct };
}

function renderQuiz(){
  const quizWordEl = document.getElementById('quizWord');
  const quizInput = document.getElementById('quizInput');
  const mcOptions = document.getElementById('mcOptions');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizProgressLabel = document.getElementById('quizProgressLabel');
  const quizProgressFill = document.getElementById('quizProgressFill');
  const quizScoreLabel = document.getElementById('quizScoreLabel');
  const quizCheckBtn = document.getElementById('quizCheckBtn');

  if(words.length === 0){
    quizWordEl.textContent = "Chưa có từ nào";
    quizInput.value = '';
    quizInput.className = 'quiz-input';
    quizInput.disabled = true;
    quizInput.placeholder = '';
    quizInput.style.display = 'block';
    mcOptions.style.display = 'none';
    quizCheckBtn.style.display = 'inline-block';
    quizFeedback.innerHTML = "Thêm từ ở tab Danh sách để bắt đầu quiz.";
    quizProgressLabel.textContent = "Câu 0 / 0";
    quizProgressFill.style.width = "0%";
    quizScoreLabel.textContent = "0 đúng";
    return;
  }

  const idx = quizOrder[quizIndex];
  const item = words[idx];

  if(quizDirection === 'en-vi'){
    quizWordEl.textContent = item.word;
  } else {
    quizWordEl.textContent = item.meaning;
  }

  document.getElementById('quizTopicLabel').textContent = item.topic || '';
  quizChecked = false;
  quizProgressLabel.textContent = "Câu " + (quizIndex + 1) + " / " + quizOrder.length;
  quizProgressFill.style.width = (((quizIndex) / quizOrder.length) * 100) + "%";
  quizScoreLabel.textContent = quizScore + " / " + quizAnswered + " đúng";

  if(quizMode === 'mc'){
    quizInput.style.display = 'none';
    quizCheckBtn.style.display = 'none';
    mcOptions.style.display = 'grid';
    mcOptions.innerHTML = '';

    if(words.length < 2){
      mcOptions.innerHTML = '<p style="color:var(--ink-soft); font-size:14px;">Cần thêm ít nhất 2 từ để dùng trắc nghiệm.</p>';
      return;
    }

    const { options, correct } = generateOptions(item);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'mc-option';
      btn.textContent = opt;
      btn.addEventListener('click', () => selectOption(btn, opt, correct, item));
      mcOptions.appendChild(btn);
    });
  } else {
    quizInput.disabled = false;
    quizInput.style.display = 'block';
    mcOptions.style.display = 'none';
    quizCheckBtn.style.display = 'inline-block';
    if(quizDirection === 'en-vi'){
      quizInput.placeholder = 'Gõ nghĩa tiếng Việt...';
    } else {
      quizInput.placeholder = 'Type the English word/phrase...';
    }
    quizInput.value = '';
    quizInput.className = 'quiz-input';
    setTimeout(() => quizInput.focus(), 50);
  }
}

function selectOption(btn, selected, correct, item){
  if(quizChecked) return;
  quizChecked = true;
  quizAnswered++;

  const quizFeedback = document.getElementById('quizFeedback');
  const quizScoreLabel = document.getElementById('quizScoreLabel');
  const quizProgressFill = document.getElementById('quizProgressFill');
  const isCorrect = normalizeVi(selected) === normalizeVi(correct);

  if(isCorrect){
    quizScore++;
    btn.classList.add('correct');
    quizFeedback.innerHTML =
      `<span class="verdict correct">Đúng! ✓</span>` +
      (item.example ? `<span class="quiz-example">"${escapeHtml(item.example)}"</span>` : '');
  } else {
    btn.classList.add('incorrect');
    quizFeedback.innerHTML =
      `<span class="verdict incorrect">Chưa đúng</span>` +
      `<span class="answer-key">Đáp án đúng: <b>${escapeHtml(correct)}</b></span>` +
      (item.example ? `<span class="quiz-example">"${escapeHtml(item.example)}"</span>` : '');
  }

  document.querySelectorAll('.mc-option').forEach(b => {
    b.classList.add('disabled');
    if(normalizeVi(b.textContent) === normalizeVi(correct)){
      b.classList.add('correct');
    }
  });

  quizScoreLabel.textContent = quizScore + " / " + quizAnswered + " đúng";
  quizProgressFill.style.width = (((quizIndex + 1) / quizOrder.length) * 100) + "%";
}

function checkQuizAnswer(){
  if(words.length === 0) return;
  const quizInput = document.getElementById('quizInput');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizScoreLabel = document.getElementById('quizScoreLabel');
  const quizProgressFill = document.getElementById('quizProgressFill');

  if(quizChecked) return; // already checked, wait for "next"

  const idx = quizOrder[quizIndex];
  const item = words[idx];
  const correctText = quizDirection === 'en-vi' ? item.meaning : item.word;
  const sim = bestSimilarity(quizInput.value, correctText);

  let verdictClass, verdictText, inputClass;
  if(sim >= 0.75){
    verdictClass = 'correct'; verdictText = 'Đúng! ✓'; inputClass = 'correct';
    quizScore++;
  } else if(sim >= 0.35){
    verdictClass = 'partial'; verdictText = 'Gần đúng';
    inputClass = 'partial';
    quizScore += 0.5;
  } else {
    verdictClass = 'incorrect'; verdictText = 'Chưa đúng';
    inputClass = 'incorrect';
  }
  quizAnswered++;

  const answerLabel = quizDirection === 'en-vi' ? 'Nghĩa đúng' : 'Từ đúng';
  quizInput.className = 'quiz-input ' + inputClass;
  quizFeedback.innerHTML =
    `<span class="verdict ${verdictClass}">${verdictText}</span>` +
    `<span class="answer-key">${answerLabel}: <b>${escapeHtml(correctText)}</b></span>` +
    (item.example ? `<span class="quiz-example">"${escapeHtml(item.example)}"</span>` : '');

  quizScoreLabel.textContent = quizScore + " / " + quizAnswered + " đúng";
  quizProgressFill.style.width = (((quizIndex + 1) / quizOrder.length) * 100) + "%";
  quizChecked = true;
}

function nextQuizQuestion(){
  if(words.length === 0) return;
  if(quizMode === 'type' && !quizChecked){
    checkQuizAnswer();
    return;
  }
  if(!quizChecked) return;
  quizIndex = (quizIndex + 1) % quizOrder.length;
  if(quizIndex === 0){
    showToast('Hết vòng — bắt đầu lại với thứ tự mới');
    const idx0 = quizOrder.shift();
    for(let i = quizOrder.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [quizOrder[i], quizOrder[j]] = [quizOrder[j], quizOrder[i]];
    }
    quizOrder.push(idx0);
    quizIndex = 0;
  }
  renderQuiz();
}

function shuffleOrder(){
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  currentIndex = 0;
  cardEl.classList.remove('flipped');
  renderCard();
}

function renderCard(){
  if(words.length === 0){
    frontWordEl.textContent = "Chưa có từ nào";
    backMeaningEl.textContent = "Thêm từ ở tab Danh sách";
    backExampleEl.textContent = "";
    progressLabel.textContent = "0 / 0";
    progressFill.style.width = "0%";
    document.getElementById('frontTopic').textContent = "";
    return;
  }
  if(order.length === 0){ resetOrder(); }
  const idx = order[currentIndex];
  const item = words[idx];
  frontWordEl.textContent = item.word;
  backMeaningEl.textContent = item.meaning;
  backExampleEl.textContent = item.example || "";
  document.getElementById('frontTopic').textContent = item.topic ? item.topic : "";
  progressLabel.textContent = (currentIndex + 1) + " / " + order.length;
  progressFill.style.width = (((currentIndex+1) / order.length) * 100) + "%";
  const knownCount = words.filter(w => w.known).length;
  knownLabel.textContent = knownCount + " đã nhớ";
}

function flipCard(){
  if(words.length === 0) return;
  cardEl.classList.toggle('flipped');
}

function goTo(delta){
  if(words.length === 0) return;
  cardEl.classList.remove('flipped');
  currentIndex = (currentIndex + delta + order.length) % order.length;
  renderCard();
}

function markCurrent(known){
  if(words.length === 0) return;
  const idx = order[currentIndex];
  words[idx].known = known;
  saveData();
  renderCard();
  setTimeout(() => goTo(1), 180);
}

function renderList(){
  listContainer.innerHTML = '';
  const filtered = activeTopicList ? words.filter(w => w.topic === activeTopicList) : words;
  totalCount.textContent = filtered.length + (activeTopicList ? ' / ' + words.length : '');
  filtered.forEach((item) => {
    const i = words.indexOf(item);
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="list-head">
        <div>
          <p class="list-word">${escapeHtml(item.word)}</p>
          <p class="list-meaning">${escapeHtml(item.meaning)}</p>
          ${item.topic ? `<span class="pill topic">${escapeHtml(item.topic)}</span>` : ''}
        </div>
        <span class="pill ${item.known ? 'known' : 'new'}">${item.known ? 'Đã nhớ' : 'Đang học'}</span>
      </div>
      ${item.example ? `<p class="list-example">"${escapeHtml(item.example)}"</p>` : ''}
      <button class="delete-btn" data-idx="${i}">Xóa</button>
    `;
    listContainer.appendChild(card);
  });

  listContainer.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const idx = parseInt(e.target.getAttribute('data-idx'));
      words.splice(idx, 1);
      await saveData();
      resetOrder();
      resetQuiz();
      renderList();
      renderCard();
      renderTopicFilters();
      showToast('Đã xóa từ');
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  renderTopicFilters();
  renderCard();
  renderList();
  resetQuiz();
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.getAttribute('data-tab');
    reviewView.style.display = target === 'review' ? 'flex' : 'none';
    quizView.style.display = target === 'quiz' ? 'block' : 'none';
    listView.style.display = target === 'list' ? 'block' : 'none';
    if(target === 'list') renderList();
    if(target === 'quiz') renderQuiz();
  });
});

// Card interactions
cardEl.addEventListener('click', flipCard);
document.getElementById('prevBtn').addEventListener('click', () => goTo(-1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(1));
document.getElementById('shuffleBtn').addEventListener('click', shuffleOrder);
document.getElementById('knownBtn').addEventListener('click', () => markCurrent(true));
document.getElementById('reviewAgainBtn').addEventListener('click', () => markCurrent(false));

// Add new word
document.getElementById('addBtn').addEventListener('click', async () => {
  const wordEl = document.getElementById('inWord');
  const meaningEl = document.getElementById('inMeaning');
  const exampleEl = document.getElementById('inExample');
  const topicEl = document.getElementById('inTopic');

  const word = wordEl.value.trim();
  const meaning = meaningEl.value.trim();
  const example = exampleEl.value.trim();
  const topic = topicEl.value.trim();

  if(!word || !meaning){
    showToast('Nhập từ và nghĩa nhé');
    return;
  }

  words.push({ word, meaning, example, known: false, topic });
  await saveData();
  resetOrder();
  resetQuiz();
  renderTopicFilters();
  renderList();
  renderCard();

  wordEl.value = '';
  meaningEl.value = '';
  exampleEl.value = '';
  // keep topic prefilled for convenience
  wordEl.focus();
  showToast('Đã thêm vào sổ ✓');
});

document.getElementById('quizCheckBtn').addEventListener('click', checkQuizAnswer);
document.getElementById('quizNextBtn').addEventListener('click', nextQuizQuestion);
document.querySelectorAll('[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-dir]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quizDirection = btn.getAttribute('data-dir');
    renderQuiz();
  });
});
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quizMode = btn.getAttribute('data-mode');
    renderQuiz();
  });
});
document.getElementById('quizInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    if(!quizChecked) checkQuizAnswer();
    else nextQuizQuestion();
  }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && quizView.style.display !== 'none'){
    const active = document.activeElement;
    if(active && active.id === 'quizInput') return;
    if(!quizChecked) checkQuizAnswer();
    else nextQuizQuestion();
  }
});

reviewView.style.display = 'flex';
quizView.style.display = 'none';
listView.style.display = 'none';

// Import
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();

  reader.onload = async (ev) => {
    let rows = [];
    if(ext === 'csv'){
      const text = ev.target.result;
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
      for(let i = 1; i < lines.length; i++){
        const vals = lines[i].match(/(".*?"|[^,]+)(?=,|$)/g) || [];
        const clean = vals.map(v => v.replace(/^"|"$/g,'').trim());
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = clean[idx] || ''; });
        if(obj.word && obj.meaning) rows.push(obj);
      }
    } else {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:''});
      json.forEach(r => {
        const keys = Object.keys(r).map(k => k.toLowerCase());
        const get = (k) => r[Object.keys(r).find(x => x.toLowerCase() === k)] || '';
        if(get('word') && get('meaning')) rows.push({
          word: get('word'), meaning: get('meaning'),
          example: get('example'), topic: get('topic'),
          known: get('known') === 'true'
        });
      });
    }

    if(rows.length === 0){ showToast('Không tìm thấy từ nào'); return; }
    const existing = new Set(words.map(w => w.word.toLowerCase()));
    let added = 0;
    rows.forEach(r => {
      if(!existing.has(r.word.toLowerCase())){
        words.push({ word: r.word, meaning: r.meaning, example: r.example||'', topic: r.topic||'', known: r.known||false });
        added++;
      }
    });
    await saveData();
    resetOrder(); resetQuiz(); renderTopicFilters(); renderList(); renderCard();
    showToast(`Đã import ${added} từ mới ✓`);
    e.target.value = '';
  };

  if(ext === 'csv') reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
});

// Export
document.getElementById('exportBtn').addEventListener('click', () => {
  const headers = ['word','meaning','example','topic','known'];
  const rows = [headers, ...words.map(w => [w.word, w.meaning, w.example||'', w.topic||'', w.known ? 'true':'false'])];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vocab_notebook.csv';
  a.click();
});

loadData();
</script>
